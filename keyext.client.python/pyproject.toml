[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "key-rpcclient-python"
version = "0.1.0"
description = "Python client for the KeY RPC server"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alexander Weigl" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.setuptools.packages.find]
include = ["keyapi*"]
